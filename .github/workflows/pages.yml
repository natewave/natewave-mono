# Builds Natewave Mono from private-build-plans.toml and publishes site/ to GitHub Pages.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "private-build-plans.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running deployment finish.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  IOSEVKA_TAG: v34.4.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Fonts only change with the build plan (or this workflow), so page-only edits skip the build.
      - name: Restore fonts built for this plan
        id: fonts
        uses: actions/cache@v6
        with:
          path: |
            site/fonts
            site/download
          key: natewave-${{ env.IOSEVKA_TAG }}-${{ hashFiles('private-build-plans.toml', '.github/workflows/pages.yml') }}

      - name: Set up Node.js
        if: steps.fonts.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false

      - name: Build the font with Iosevka
        if: steps.fonts.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$IOSEVKA_TAG" https://github.com/be5invis/Iosevka.git
          cp private-build-plans.toml Iosevka/
          cd Iosevka
          npm ci
          npm run build -- --jCmd=4 webfont-unhinted::NatewaveMono

      - name: Package web fonts and the download
        if: steps.fonts.outputs.cache-hit != 'true'
        run: |
          dist=Iosevka/dist/NatewaveMono
          mkdir -p site/fonts site/download package/NatewaveMono
          cp "$dist"/WOFF2-Unhinted/*.woff2 site/fonts/
          cp Iosevka/LICENSE.md site/fonts/OFL.txt
          cp "$dist"/TTF-Unhinted/*.ttf package/NatewaveMono/
          cp Iosevka/LICENSE.md package/NatewaveMono/OFL.txt
          (cd package && zip -q -r ../site/download/NatewaveMono-TTF-Unhinted.zip NatewaveMono)

      - name: Check site assets
        run: |
          for style in Regular Italic Bold BoldItalic; do
            test -s "site/fonts/NatewaveMono-$style.woff2"
          done
          test -s site/fonts/OFL.txt
          unzip -l site/download/NatewaveMono-TTF-Unhinted.zip

      # Keeps the page's GitHub links correct in forks and after a rename.
      - name: Point repository links at this repository
        run: sed -i "s#natewave/natewave-mono#${GITHUB_REPOSITORY}#g" site/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
